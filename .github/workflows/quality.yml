name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static-site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke-test entry pages
        run: |
          npm run serve > /tmp/zhou-jing-art-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          npm run smoke
